[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained decoding function calling engine for Qwen3-0.6B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pydantic>=2.14.1",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "llm_sdk"]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]